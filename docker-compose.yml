services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: streamguard
      POSTGRES_PASSWORD: streamguard
      POSTGRES_DB: streamguard
    ports: ["5435:5432"]
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "streamguard"]
      interval: 2s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
  redpanda:
    profiles: ["redpanda"]
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:19092
    ports: ["19092:9092"]
